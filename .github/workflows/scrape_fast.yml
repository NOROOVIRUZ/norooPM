name: Scrape Fast

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 오전 9시 KST (UTC 0:00)
  workflow_dispatch:
    inputs:
      categories:
        description: '카테고리 (예: 전동칫솔 구강세정기)'
        required: false
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          scrapling install

      - name: Run scraper
        id: scraper
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set +e
          CATS="${{ github.event.inputs.categories }}"
          if [ "$CATS" = "all" ] || [ -z "$CATS" ]; then
            python main.py --platforms naver
          else
            python main.py --categories $CATS --platforms naver
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name "norooPM-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date +'%Y-%m-%d %H:%M') 수집"
          git push

      - name: Telegram 알림 (성공 시만)
        if: steps.scraper.outputs.exit_code == '0'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ norooPM 수집 완료 (AmazonJP + Naver)%0A👉 https://norooviruz.github.io/norooPM/"
