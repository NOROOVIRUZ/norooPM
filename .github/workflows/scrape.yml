name: Market Scrape

on:
  schedule:
    - cron: '0 17 * * *'   # 매일 UTC 17:00 = KST 02:00
  workflow_dispatch:
    inputs:
      categories:
        description: '카테고리 (space로 구분, 예: 전동칫솔 마사지기)'
        required: false
        default: 'all'
      platforms:
        description: '플랫폼 (amazon aliexpress jd)'
        required: false
        default: 'amazon aliexpress jd'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          scrapling install

      - name: Install DrissionPage browser
        run: python -c "from DrissionPage import ChromiumOptions; ChromiumOptions().auto_port(True)"
        continue-on-error: true

      - name: Run scraper
        run: |
          CATS="${{ github.event.inputs.categories }}"
          PLATS="${{ github.event.inputs.platforms }}"

          if [ "$CATS" = "all" ] || [ -z "$CATS" ]; then
            python main.py --platforms $PLATS
          else
            python main.py --categories $CATS --platforms $PLATS
          fi

      - name: Commit data
        run: |
          git config user.name "norooPM-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date +'%Y-%m-%d') 수집 완료"
          git push

      - name: Telegram 완료 알림
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI="✅"
          [ "$STATUS" != "success" ] && EMOJI="❌"
          MSG="${EMOJI} norooPM 수집 ${STATUS} — $(date +'%Y-%m-%d %H:%M') UTC"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG" \
            -d parse_mode="HTML"
