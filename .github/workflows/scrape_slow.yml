name: Scrape Slow

on:
  schedule:
    - cron: '30 */4 * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: '카테고리 (예: 전동칫솔 마사지기)'
        required: false
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          scrapling install

      - name: Run scraper
        id: scraper
        run: |
          set +e
          CATS="${{ github.event.inputs.categories }}"
          if [ "$CATS" = "all" ] || [ -z "$CATS" ]; then
            python main.py --platforms jd coupang shopee
          else
            python main.py --categories $CATS --platforms jd coupang shopee
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name "norooPM-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data(slow): $(date +'%Y-%m-%d %H:%M') 수집"
          git push

