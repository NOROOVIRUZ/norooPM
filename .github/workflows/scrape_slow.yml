name: Scrape Slow

on:
  schedule:
    - cron: '30 */4 * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: '카테고리 (예: 전동칫솔 마사지기)'
        required: false
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          scrapling install

      - name: Run scraper
        id: scraper
        run: |
          CATS="${{ github.event.inputs.categories }}"
          if [ "$CATS" = "all" ] || [ -z "$CATS" ]; then
            python main.py --platforms aliexpress jd coupang shopee
          else
            python main.py --categories $CATS --platforms aliexpress jd coupang shopee
          fi
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Commit data
        run: |
          git config user.name "norooPM-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data(slow): $(date +'%Y-%m-%d %H:%M') 수집"
          git push

      - name: Telegram 알림 (성공 시만)
        if: steps.scraper.outputs.exit_code == '0'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ norooPM 수집 완료 (AliExpress/JD/쿠팡/Shopee)%0A👉 https://norooviruz.github.io/norooPM/"
